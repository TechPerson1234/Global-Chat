function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

async function subscribeToPush() {
  if (!swRegistration) {
    console.warn('Service Worker not registered yet');
    showToast('Service Worker not ready. Try refreshing.');
    return;
  }

  let permission = Notification.permission;
  if (permission === 'denied') {
    showToast('Notifications blocked. Enable in Settings.');
    return;
  }
  if (permission === 'default') {
    permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      showToast('Notification permission denied.');
      return;
    }
  }

  try {
    const subscription = await swRegistration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    console.log('Push subscription obtained:', subscription);

    await saveSubscription(subscription);
    isPushSubscribed = true;
    showToast('🔔 Notifications enabled!');
  } catch (err) {
    console.error('Push subscription failed:', err);
    showToast('Could not enable notifications. See console.');
  }
}

async function updateBadgeCount() {
  if (!navigator.setAppBadge) {
    console.log('Badge API not supported');
    return;
  }

  const lastSeen = localStorage.getItem('lastSeenTimestamp') || new Date(0).toISOString();
  const { count, error } = await _supabase
    .from('messages')
    .select('*', { count: 'exact', head: true })
    .gt('created_at', lastSeen)
    .neq('session_id', currentSessionId);

  if (error) {
    console.error('Failed to count messages', error);
    return;
  }

  if (count > 0) {
    navigator.setAppBadge(count);
  } else {
    navigator.clearAppBadge();
  }
}

function getOrientation(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const view = new DataView(e.target.result);
            if (view.getUint16(0, false) != 0xFFD8) return resolve(1);
            const length = view.byteLength;
            let offset = 2;
            while (offset < length) {
                const marker = view.getUint16(offset, false);
                offset += 2;
                if (marker == 0xFFE1) {
                    if (view.getUint32(offset += 2, false) != 0x45786966) return resolve(1);
                    const little = view.getUint16(offset += 6, false) == 0x4949;
                    offset += view.getUint32(offset + 4, little);
                    const tags = view.getUint16(offset, little);
                    offset += 2;
                    for (let i = 0; i < tags; i++) {
                        if (view.getUint16(offset + (i * 12), little) == 0x0112) {
                            return resolve(view.getUint16(offset + (i * 12) + 8, little));
                        }
                    }
                } else if ((marker & 0xFF00) != 0xFF00) break;
                else offset += view.getUint16(offset, false);
            }
            resolve(1);
        };
        reader.readAsArrayBuffer(file.slice(0, 64 * 1024));
    });
}

async function compressImage(file) {
    const orientation = await getOrientation(file);
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height, max = 1200;
                if (orientation >= 5 && orientation <= 8) {
                    [w, h] = [h, w];
                }
                if (w > max || h > max) {
                    if (w > h) { h = (h * max) / w; w = max; }
                    else { w = (w * max) / h; h = max; }
                }
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.save();
                switch (orientation) {
                    case 2: ctx.transform(-1, 0, 0, 1, w, 0); break;
                    case 3: ctx.transform(-1, 0, 0, -1, w, h); break;
                    case 4: ctx.transform(1, 0, 0, -1, 0, h); break;
                    case 5: ctx.transform(0, 1, 1, 0, 0, 0); break;
                    case 6: ctx.transform(0, 1, -1, 0, w, 0); break;
                    case 7: ctx.transform(0, -1, -1, 0, w, h); break;
                    case 8: ctx.transform(0, -1, 1, 0, 0, h); break;
                    default: break;
                }
                ctx.drawImage(img, 0, 0);
                ctx.restore();
                canvas.toBlob(blob => resolve(new File([blob], file.name, { type:'image/jpeg' })), 'image/jpeg', 0.8);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

async function uploadImage(file, tempId) {
    const compressed = await compressImage(file);
    const fileName = `${tempId}_${Date.now()}.jpg`;

    const { data: { publicUrl } } = _supabase.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);

}

    const div = document.createElement('div');
    div.className = `message ${isMine ? 'mine' : 'other'}${isFailed ? ' failed' : ''}`;
    div.setAttribute('data-id', msg.id);
    if (isPending) {
        div.setAttribute('data-pending', 'true');
        div.setAttribute('data-sending', 'true'); 
    }
    let imgHtml = '';
    if (msg.image_url && msg.image_url !== 'uploading...') {
        imgHtml = `<img class="message-image" src="${msg.image_url}" style="max-width:150px; margin-top:5px; cursor:pointer;">`;
    } else if (msg.image_url === 'uploading...') {
        imgHtml = `<div class="uploading-indicator" style="margin-top:5px; font-size:0.7rem;"><i class="fas fa-spinner fa-pulse"></i> Uploading...</div>`;
    }
    const content = msg.message || '';
    const editedHtml = msg.edited_at ? '<span class="edited-badge">(edited)</span>' : '';
    const isOwner = (msg.session_id === currentSessionId);
    let actionButtons = `
        <button class="message-menu-btn copy-btn"><i class="fas fa-copy"></i></button>
        ${isOwner && !msg.is_deleted ? `<button class="message-menu-btn edit-btn"><i class="fas fa-edit"></i></button>` : ''}
        ${isOwner && !msg.is_deleted ? `<button class="message-menu-btn delete-btn"><i class="fas fa-trash-alt"></i></button>` : ''}
    `;
    if (isFailed) {
        actionButtons += `<button class="message-menu-btn retry-btn"><i class="fas fa-redo-alt"></i></button>`;
    }
    div.innerHTML = `
        <div class="message-header">
            <span class="message-sender ${isMine ? 'me' : ''}">${escapeHtml(msg.username)}</span>
            <span class="message-time">${formatTime(msg.created_at)}</span>
            ${editedHtml}
            ${actionButtons}
        </div>
        <div class="message-content">${escapeHtml(content)}</div>
        ${imgHtml}
    `;
    div.querySelector('.copy-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        navigator.clipboard.writeText(msg.message || '');
        showToast('Copied');
    });
    div.querySelector('.edit-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        activeMessageId = msg.id;
        editInput.value = msg.message || '';
        editModal.style.display = 'flex';
    });
    div.querySelector('.delete-btn')?.addEventListener('click', e => {
        e.stopPropagation();
        activeMessageId = msg.id;
        deleteModal.style.display = 'flex';
    });
    const imgEl = div.querySelector('.message-image');
    if (imgEl) imgEl.addEventListener('click', () => openLightbox(msg.image_url));
    return div;
}

function replaceMessageElement(msg, isMine) {
    const oldDiv = document.querySelector(`.message[data-id="${msg.id}"]`);
    const newDiv = createMessageElement(msg, isMine);
    if (oldDiv) oldDiv.replaceWith(newDiv);
    else messagesDiv.appendChild(newDiv);
    scrollToBottom();
}


async function loadMessages() {
    const { data, error } = await _supabase
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(10000);
    if (error) { console.error(error); showToast('Error loading messages'); return; }
    messagesDiv.innerHTML = '';
    if (!data || data.length === 0) {
        messagesDiv.innerHTML = '<div style="text-align:center;padding:30px"><i class="fas fa-comment-dots"></i><h3>Be the first to say something!</h3></div>';
        return;
    }
    data.forEach(msg => {
        const isMine = (msg.session_id === currentSessionId);
        messagesDiv.appendChild(createMessageElement(msg, isMine));
    });
    scrollToBottom();
    await updateBadgeCount();
}


function setupRealtime() {
    if (realtimeChannel) {
        _supabase.removeChannel(realtimeChannel);
    }
    realtimeChannel = _supabase.channel('public:messages');
    realtimeChannel
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
            const newMsg = payload.new;
            const isMine = (newMsg.session_id === currentSessionId);

            console.log('📨 Realtime INSERT:', newMsg.id, isMine ? '(mine)' : '(other)');

          
            if (isMine) {
                const sendingEl = document.querySelector('.message.mine[data-sending="true"]');
                if (sendingEl) {
                    const contentEl = sendingEl.querySelector('.message-content');
                    if (contentEl && contentEl.textContent === (newMsg.message || '')) {
                        console.log('✅ Replaced sending via Realtime');
                        const realEl = createMessageElement(newMsg, true);
                        sendingEl.replaceWith(realEl);
                        scrollToBottom();
                        return;
                    }
                }
                
                if (document.querySelector(`.message[data-id="${newMsg.id}"]`)) {
                    console.log('⏭️ Skipping duplicate (ID exists)');
                    return;
                }
                
                console.log('📨 Adding own message (no sending element)');
                messagesDiv.appendChild(createMessageElement(newMsg, true));
                scrollToBottom();
                return;
            }

            if (document.querySelector(`.message[data-id="${newMsg.id}"]`)) {
                console.log('⏭️ Skipping duplicate (ID exists)');
                return;
            }
            console.log('📨 Adding message from:', newMsg.username);
            messagesDiv.appendChild(createMessageElement(newMsg, false));
            scrollToBottom();
            updateBadgeCount();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, payload => {
            const isMine = (payload.new.session_id === currentSessionId);
            replaceMessageElement(payload.new, isMine);
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, payload => {
            const el = document.querySelector(`.message[data-id="${payload.old.id}"]`);
            if (el) el.remove();
        })
        .subscribe((status, err) => {
            console.log('📡 Realtime status:', status);
            if (status === 'SUBSCRIBED') {
                console.log('✅ Realtime connected!');
            } else if (status === 'CHANNEL_ERROR' || err) {
                console.warn('⚠️ Realtime error, reconnecting...', err);
                setTimeout(() => setupRealtime(), 3000);
            }
        });
}


function startFallbackPolling() {
    if (fallbackInterval) clearInterval(fallbackInterval);
    let lastEditCheck = new Date().toISOString();
    fallbackInterval = setInterval(async () => {
        const { data: latest, error } = await _supabase
            .from('messages')
            .select('id')
            .order('created_at', { ascending: false })
            .limit(1);
        if (error) return;
        const latestMsgId = latest?.[0]?.id;
        const lastDisplayedId = messagesDiv.querySelector('.message:last-child')?.getAttribute('data-id');
        if (latestMsgId && latestMsgId !== lastDisplayedId) {
            console.log('🔄 Fallback: new messages detected, reloading...');
            await loadMessages();
            updateBadgeCount();
            lastEditCheck = new Date().toISOString();
            return;
        }

        const { data: edited, error: editErr } = await _supabase
            .from('messages')
            .select('id')
            .gt('edited_at', lastEditCheck)
            .limit(1);
        if (!editErr && edited && edited.length > 0) {
            console.log('🔄 Fallback: edit detected, reloading...');
            lastEditCheck = new Date().toISOString();
            await loadMessages();
        }
    }, 5000);
}


async function sendMessage() {
    if (!currentUser) { showToast('Set your name first'); return; }
    const text = messageInput.value.trim();
    const imageToSend = currentImageFile;
    if (!text && !imageToSend) return;

    const tempId = crypto.randomUUID();
    const now = new Date().toISOString();
    const hasImage = !!imageToSend;

    
    const optimisticMsg = {
        id: tempId,
        username: currentUser,
        message: text || '',
        image_url: hasImage ? 'uploading...' : null,
        created_at: now,
        session_id: currentSessionId,
        edited_at: null,
        is_deleted: false
    };
    const optimisticElement = createMessageElement(optimisticMsg, true, false, true);
    messagesDiv.appendChild(optimisticElement);
    scrollToBottom();

 
    messageInput.value = '';
    charCountSpan.textContent = '0/500';
    clearImagePreview();
    imageFile.value = '';
    currentImageFile = null;

    sendMsgBtn.disabled = false;
    messageInput.disabled = false;
    if (imagePicker) imagePicker.disabled = false;
    messageInput.focus();

  
    try {
        let imageUrl = null;
        if (hasImage) {
            imageUrl = await uploadImage(imageToSend, tempId);
            const imgIndicator = optimisticElement.querySelector('.uploading-indicator');
            if (imgIndicator) {
                const img = document.createElement('img');
                img.className = 'message-image';
                img.src = imageUrl;
                img.style.cssText = 'max-width:150px; margin-top:5px; cursor:pointer;';
                img.addEventListener('click', () => openLightbox(imageUrl));
                imgIndicator.replaceWith(img);
            }
        }
        const { data: inserted, error } = await _supabase
            .from('messages')
            .insert([{
                username: currentUser,
                message: text || '',
                image_url: imageUrl || null,
                created_at: now,
                session_id: currentSessionId,
                is_deleted: false
            }])
            .select();
        if (error) throw error;
        const realMsg = inserted[0];


        const sendingEl = document.querySelector('.message.mine[data-sending="true"]');
        if (sendingEl) {
            const realElement = createMessageElement(realMsg, true);
            sendingEl.replaceWith(realElement);
            console.log('✅ Replaced sending message (direct)');
        } else {
         
            replaceMessageElement(realMsg, true);
        }
        scrollToBottom();
    } catch (err) {
        console.error(err);
        optimisticElement.classList.add('failed');
        const retryBtn = document.createElement('button');
        retryBtn.className = 'message-menu-btn retry-btn';
        retryBtn.innerHTML = '<i class="fas fa-redo-alt"></i>';
        retryBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showToast('Tap to retry – message not sent.');
        });
        const header = optimisticElement.querySelector('.message-header');
        if (header) header.appendChild(retryBtn);
        showToast('Failed to send. Tap retry or try again.');
    }
}


editConfirm.onclick = async () => {
    const newText = editInput.value.trim();
    if (newText) {
        const { data, error } = await _supabase
            .from('messages')
            .update({ message: newText, edited_at: new Date().toISOString() })
            .eq('id', activeMessageId)
            .select();
        if (error) {
            showToast('Edit failed: ' + error.message);
        } else {
            showToast('Message edited');
            if (data && data[0]) {
                replaceMessageElement(data[0], data[0].session_id === currentSessionId);
            }
        }
    }
    editModal.style.display = 'none';
};
editCancel.onclick = () => editModal.style.display = 'none';

deleteConfirm.onclick = async () => {
    const { error } = await _supabase
        .from('messages')
        .delete()
        .eq('id', activeMessageId);
    if (error) {
        showToast('Delete failed: ' + error.message);
    } else {
        showToast('Message permanently deleted');
        const el = document.querySelector(`.message[data-id="${activeMessageId}"]`);
        if (el) el.remove();
    }
    deleteModal.style.display = 'none';
};
deleteCancel.onclick = () => deleteModal.style.display = 'none';
window.onclick = e => {
    if (e.target === editModal) editModal.style.display = 'none';
    if (e.target === deleteModal) deleteModal.style.display = 'none';
};


function handleImageSelect(file) {
    currentImageFile = file;
    const reader = new FileReader();
    reader.onload = e => {
        previewImg.src = e.target.result;
        previewFileName.textContent = file.name;
        previewSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
        previewArea.style.display = 'flex';
    };
    reader.readAsDataURL(file);
}
function clearImagePreview() {
    currentImageFile = null;
    previewArea.style.display = 'none';
    previewImg.src = '';
    imageFile.value = '';
}


async function saveName() {
    const name = nameInput.value.trim();
    if (!name) { showToast('Please enter a name'); return; }
    currentUser = name;
    if (!currentSessionId) {
        let stored = localStorage.getItem('globalChatSessionId');
        if (!stored) {
            stored = crypto.randomUUID();
            localStorage.setItem('globalChatSessionId', stored);
        }
        currentSessionId = stored;
        sessionStorage.setItem('globalChatSessionId', stored);
    }
    localStorage.setItem('globalChatName', name);
    sessionStorage.setItem('globalChatName', name);
    messageInput.disabled = false;
    sendMsgBtn.disabled = false;
    if (imagePicker) imagePicker.disabled = false;
    nameStatus.innerHTML = `<i class="fas fa-check-circle"></i> <span>Chatting as ${escapeHtml(name)}</span><br><small style="font-size:0.6rem;">(Your identity is stored locally on this device)</small>`;
    await loadMessages();
    setupRealtime();
    startFallbackPolling();
    showToast(`Welcome ${name}!`);

    refreshBtn.style.display = 'block';

    
    if ('serviceWorker' in navigator && swRegistration) {
        if (Notification.permission === 'default') {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                await subscribeToPush();
            } else {
                showToast('Notification permission denied.');
            }
        } else if (Notification.permission === 'granted' && !isPushSubscribed) {
            await subscribeToPush();
        }
    } else {
    
        console.warn('SW not ready at saveName time, retrying in 2s');
        setTimeout(async () => {
            if (swRegistration && Notification.permission === 'granted' && !isPushSubscribed) {
                await subscribeToPush();
            }
        }, 2000);
    }
}


function openLightbox(url) {
    lightboxImg.src = url;
    lightbox.style.display = 'flex';
    lightboxImg.setAttribute('data-url', url);
}
function closeLightbox() { lightbox.style.display = 'none'; }

async function shareImage() {
    const url = lightboxImg.getAttribute('data-url') || lightboxImg.src;
    if (!url) return;
    try {
        const response = await fetch(url);
        const blob = await response.blob();
        const file = new File([blob], 'chat-image.jpg', { type: blob.type || 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file] });
        } else {
            downloadImage();
        }
    } catch (err) {
        if (err.name !== 'AbortError') {
            showToast('Share failed – try download instead');
        }
    }
}

function downloadImage() {
    const url = lightboxImg.getAttribute('data-url') || lightboxImg.src;
    if (!url) return;
    const link = document.createElement('a');
    link.href = url;
    link.download = 'chat-image.jpg';
    link.click();
}


if (window.visualViewport) {
    visualViewport.addEventListener('resize', () => {
        if (visualViewport.height < window.innerHeight * 0.8) {
            scrollToBottom();
        }
    });
}
nameInput.addEventListener('focus', () => {
    setTimeout(() => {
        nameInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
});
document.addEventListener('focusin', (e) => {
    if (e.target === messageInput) {
        scrollToBottom();
    }
});

window.addEventListener('online', () => {
    showToast('Back online! Syncing…');
    loadMessages();
    setupRealtime();
    startFallbackPolling();
});
window.addEventListener('offline', () => {
    showToast('You are offline. Messages may not send.');
});


document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
       
        localStorage.setItem('lastSeenTimestamp', new Date().toISOString());
        if (navigator.clearAppBadge) {
            navigator.clearAppBadge();
        }
        loadMessages();
        setupRealtime();
    }
});


if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
        swRegistration = reg;
        console.log('Service Worker registered', reg);
        reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    showToast('Update available – refresh to get the latest version');
                    reloadBtn.style.background = '#f72585';
                }
            });
        });
    }).catch(err => console.error('SW registration failed', err));
}


let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        }
    });
});


saveNameBtn.addEventListener('click', saveName);
sendMsgBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('input', () => { charCountSpan.textContent = `${messageInput.value.length}/500`; });
messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
imagePicker.addEventListener('click', () => imageFile.click());
imageFile.addEventListener('change', e => { if (e.target.files[0]) handleImageSelect(e.target.files[0]); });
cancelImg.addEventListener('click', clearImagePreview);
lightboxClose.addEventListener('click', closeLightbox);
lightboxDownload.addEventListener('click', downloadImage);
lightboxShare.addEventListener('click', shareImage);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
reloadBtn.addEventListener('click', () => location.reload());
refreshBtn.addEventListener('click', () => {
    showToast('🔄 Refreshing messages...');
    loadMessages();
});


const savedName = localStorage.getItem('globalChatName') || sessionStorage.getItem('globalChatName');
const savedSession = localStorage.getItem('globalChatSessionId') || sessionStorage.getItem('globalChatSessionId');
if (savedName) {
    nameInput.value = savedName;
    if (savedSession) currentSessionId = savedSession;
    saveName();
} else {
    messageInput.disabled = true;
    sendMsgBtn.disabled = true;
    if (imagePicker) imagePicker.disabled = true;
}
</script>
</body>
</html>
